name: Deploy backend to Railway

# This service deploys via `railway up` (CLI upload), not Railway's GitHub integration.
# Without this, merges to main never reach production. Runs on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; let an in-flight one finish rather than cancelling it mid-build.
concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # RAILWAY_TOKEN must be a *project token* for the production environment
      # (Railway dashboard -> project -> Settings -> Tokens), stored as a repo secret.
      # --ci streams build logs and exits non-zero if the build/deploy fails.
      - name: Deploy
        run: railway up --ci --service atlaso-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
