server:
  port: ${PORT:8080}
  # Let the container (Tomcat RemoteIpValve) resolve the real client IP + scheme from the
  # proxy's forwarded headers, trusting only internal proxies — so request.remoteAddr is the
  # client, not a spoofable first X-Forwarded-For hop.
  forward-headers-strategy: native

spring:
  application:
    name: atlaso-backend

  datasource:
    url: "jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:atlaso}"
    username: "${PGUSER:postgres}"
    password: "${PGPASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
    hikari:
      # Explicit pool sizing (default was 10). Raise via DB_POOL_SIZE if Postgres max_connections
      # allows. Note: book generation still holds a connection across OpenAI I/O (see
      # PHOTOBOOK_TX_REFACTOR_PLAN.md) — this widens the pool but the real fix is that refactor.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      # Fail fast when the pool is saturated instead of hanging indefinitely.
      connection-timeout: 20000   # 20s to acquire a connection
      max-lifetime: 1800000       # 30m — recycle before Postgres/proxy idle cutoffs
      keepalive-time: 300000      # 5m keepalive probe

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      # Bound multipart (bulk photo upload) request bodies. Guest uploads go direct to S3
      # via presigned URLs and don't hit these limits.
      max-file-size: ${MAX_FILE_SIZE:30MB}
      max-request-size: ${MAX_REQUEST_SIZE:150MB}

# OpenAI API Configuration
openai:
  api:
    key: "${OPENAI_API_KEY}"
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1/
    # Concurrent vision calls during book generation. Raise if your OpenAI tier
    # allows higher RPM; override with OPENAI_API_ANALYSIS_CONCURRENCY.
    analysis-concurrency: ${OPENAI_API_ANALYSIS_CONCURRENCY:20}

# Razorpay payment gateway
razorpay:
  key-id: "${RAZORPAY_KEY_ID:}"
  key-secret: "${RAZORPAY_KEY_SECRET:}"
  # Dashboard-configured webhook signing secret (distinct from key-secret). Set on the
  # Razorpay webhook subscribed to payment.captured; leaving it blank disables the webhook.
  webhook-secret: "${RAZORPAY_WEBHOOK_SECRET:}"

# Brevo transactional email
brevo:
  api-key: "${BREVO_API_KEY:}"
  sender-email: "${BREVO_SENDER_EMAIL:support@myatlaso.com}"
  sender-name: "${BREVO_SENDER_NAME:Atlaso}"

# Admin dashboard shared secret (X-Admin-Key header)
admin:
  api-key: "${ADMIN_API_KEY:}"

atlaso:
  auth:
    jwt-secret: "${JWT_SECRET}"
    google-client-id: "${GOOGLE_CLIENT_ID}"
  storage:
    # Safe default: S3. Local storage (and its public dev endpoints) only activates when a
    # developer explicitly sets STORAGE_TYPE=local — a prod that forgets the var stays on S3
    # instead of silently exposing the local file endpoints.
    type: "${STORAGE_TYPE:s3}"
    local:
      base-path: ./uploads
    s3:
      bucket-name: "${S3_BUCKET_NAME:}"
      region: "${AWS_REGION:us-east-1}"

logging:
  level:
    com.atlaso: INFO
    org.hibernate.SQL: WARN
    okhttp3.OkHttpClient: WARN
